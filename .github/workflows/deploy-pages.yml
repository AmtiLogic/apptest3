name: Deploy to GitHub Pages

# Publishes the static bundle. Requires Settings -> Pages -> Source set to
# "GitHub Actions" (not "Deploy from a branch", which runs Jekyll and would
# publish the README instead of the app).
on:
  push:
    branches: [claude/garmin-data-web-app-5nk32r]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build static bundle
        run: npm run build:static
        env:
          # Project sites are served from /<repo>.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
